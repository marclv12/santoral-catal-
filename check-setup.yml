name: Comprova la connexió amb Telegram

on:
  workflow_dispatch:
    inputs:
      send_test_message:
        description: "Envia també un missatge breu de prova"
        required: true
        default: true
        type: boolean

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal·la dependències
        run: pip install -r requirements.txt

      - name: Verifica el token i el xat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST_MESSAGE: ${{ inputs.send_test_message }}
        run: python src/check_setup.py
